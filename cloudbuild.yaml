steps:
  - id: build-and-push-app-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["./scripts/build.sh"]
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "BRANCH_NAME=$BRANCH_NAME"
      - "SHORT_SHA=$SHORT_SHA"
      - "BUILD_ID=$BUILD_ID"
      - "DEPLOY_REGION=$_REGION"
      - "AR_REPOSITORY=$_AR_REPOSITORY"
      - "CLOUD_RUN_SERVICE_ACCOUNT=$_RUNTIME_SERVICE_ACCOUNT"

  - id: deploy-apps-to-cloud-run
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args: ["./scripts/deploy.sh"]
    env:
      - "PROJECT_ID=$PROJECT_ID"
      - "BRANCH_NAME=$BRANCH_NAME"
      - "SHORT_SHA=$SHORT_SHA"
      - "BUILD_ID=$BUILD_ID"
      - "DEPLOY_REGION=$_REGION"
      - "AR_REPOSITORY=$_AR_REPOSITORY"
      - "CLOUD_RUN_SERVICE_ACCOUNT=$_RUNTIME_SERVICE_ACCOUNT"

substitutions:
  _REGION: us-central1
  _AR_REPOSITORY: cloud-run-source-deploy
  _RUNTIME_SERVICE_ACCOUNT: 45358069937-compute@developer.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY