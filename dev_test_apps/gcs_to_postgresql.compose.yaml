services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gcs_to_postgresql_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 12

  importer:
    build:
      context: ../apps/gcs_to_postgresql_helpers
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: jag-pgsql-gke
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
      DB_SCHEMA: public
    volumes:
      - type: bind
        source: ${APPDATA}/gcloud
        target: /root/.config/gcloud
        read_only: true
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gcs_to_postgresql_postgres_data:
